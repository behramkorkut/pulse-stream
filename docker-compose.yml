# Infrastructure locale de pulse-stream.
# Prometheus et Grafana seront ajoutés au palier "observabilité".
name: pulse-stream

services:
  redpanda:
    # Redpanda parle le protocole Kafka : les clients Go ne voient aucune différence,
    # mais il démarre plus vite et consomme moins de mémoire qu'un cluster Kafka + ZooKeeper.
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # "internal" : pour les conteneurs du compose. "external" : pour nos programmes Go lancés sur le Mac.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092" # Kafka (depuis le Mac)
      - "9644:9644"   # API d'administration Redpanda
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  redpanda-data:
  mongo-data:
