# Infrastructure locale de pulse-stream.
# Prometheus (palier 6) lit les métriques des programmes Go ; Grafana (palier 6b) les affiche.
name: pulse-stream

# Réseau explicite. Sans cette section, Compose en crée un lui-même ("pulse-stream_default") et y branche
# tous les services : ça marche, mais c'est implicite. Le déclarer rend l'architecture lisible, et c'est ce
# réseau que rejoindront les conteneurs de nos programmes Go (collector, processor, aggregator) plus tard.
# Sur un même réseau, les conteneurs se joignent par le NOM du service : redpanda:9092, redis:6379, mongo:27017.
networks:
  pulse:
    name: pulse-net

# Réglages communs aux programmes Go lancés en conteneurs (profil "app", voir plus bas).
x-pulse-app: &pulse-app
  networks: [pulse]
  restart: on-failure
  # Durcissement : système de fichiers en lecture seule, aucune capacité Linux, pas d'élévation de privilèges.
  # Nos programmes n'écrivent rien sur le disque, donc rien de tout cela ne les gêne.
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

services:
  redpanda:
    # Redpanda parle le protocole Kafka : les clients Go ne voient aucune différence,
    # mais il démarre plus vite et consomme moins de mémoire qu'un cluster Kafka + ZooKeeper.
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # "internal" : pour les conteneurs du compose. "external" : pour nos programmes Go lancés sur le Mac.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    networks: [pulse]
    ports:
      - "19092:19092" # Kafka (depuis le Mac)
      - "9644:9644"   # API d'administration Redpanda
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    networks: [pulse]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    networks: [pulse]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    networks: [pulse]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Les programmes Go tournent sur le Mac : "host.docker.internal" désigne cette machine hôte.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.4.0
    networks: [pulse]
    ports:
      - "3000:3000"
    environment:
      # Usage LOCAL uniquement : accès sans identifiant, en administrateur. Ne jamais exposer tel quel.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      # Tout est déclaré par fichiers (versionnés dans Git) : source de données, fournisseur de dashboards, dashboards.
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------------------------------------
  # Les programmes Go en conteneurs : profil "app" (absent d'un simple `make up`).
  #   make app-up    construit les images et lance collector, processor et aggregator
  #   make app-down  les arrête
  # À ne pas combiner avec `make run-collector` & co : ce sont les mêmes ports (8080, 9101-9103).
  # Dans le réseau Docker, on joint l'infrastructure par le NOM du service (redpanda:9092, redis:6379, mongo:27017),
  # pas par localhost. Les ports de métriques sont publiés : Prometheus les lit toujours via host.docker.internal.
  # ---------------------------------------------------------------------------------------------------------
  collector:
    <<: *pulse-app
    profiles: [app]
    image: pulse-stream/collector:latest
    build:
      context: .
      args:
        CMD: collector
        VERSION: ${PULSE_VERSION:-dev}
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080" # POST /collect, GET /healthz
      - "9101:9101" # /metrics
    depends_on:
      redpanda:
        condition: service_healthy

  processor:
    <<: *pulse-app
    profiles: [app]
    image: pulse-stream/processor:latest
    build:
      context: .
      args:
        CMD: processor
        VERSION: ${PULSE_VERSION:-dev}
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDIS_ADDR: redis:6379
    ports:
      - "9102:9102" # /metrics
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  aggregator:
    <<: *pulse-app
    profiles: [app]
    image: pulse-stream/aggregator:latest
    build:
      context: .
      args:
        CMD: aggregator
        VERSION: ${PULSE_VERSION:-dev}
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDIS_ADDR: redis:6379
      MONGO_URI: mongodb://mongo:27017
    ports:
      - "9103:9103" # /metrics
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  redpanda-data:
  mongo-data:
  prometheus-data:
  grafana-data:
