# Infrastructure locale de pulse-stream.
# Prometheus (palier 6) lit les métriques des programmes Go ; Grafana (palier 6b) les affichera.
name: pulse-stream

# Réseau explicite. Sans cette section, Compose en crée un lui-même ("pulse-stream_default") et y branche
# tous les services : ça marche, mais c'est implicite. Le déclarer rend l'architecture lisible, et c'est ce
# réseau que rejoindront les conteneurs de nos programmes Go (collector, processor, aggregator) plus tard.
# Sur un même réseau, les conteneurs se joignent par le NOM du service : redpanda:9092, redis:6379, mongo:27017.
networks:
  pulse:
    name: pulse-net

services:
  redpanda:
    # Redpanda parle le protocole Kafka : les clients Go ne voient aucune différence,
    # mais il démarre plus vite et consomme moins de mémoire qu'un cluster Kafka + ZooKeeper.
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # "internal" : pour les conteneurs du compose. "external" : pour nos programmes Go lancés sur le Mac.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    networks: [pulse]
    ports:
      - "19092:19092" # Kafka (depuis le Mac)
      - "9644:9644"   # API d'administration Redpanda
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    networks: [pulse]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    networks: [pulse]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    networks: [pulse]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Les programmes Go tournent sur le Mac : "host.docker.internal" désigne cette machine hôte.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redpanda-data:
  mongo-data:
  prometheus-data:
