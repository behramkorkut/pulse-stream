{{- if .Values.infra.enabled }}
{{- $l := dict "root" $ "name" "mongo" }}
# MongoDB : compteurs par minute et positions Kafka. StatefulSet, comme Redpanda (programme à état). Les données sont
# dans un volume emptyDir : elles vivent aussi longtemps que le pod. Pour les garder, il faudrait un
# volumeClaimTemplate. Jeu de répliques d'UN nœud : les transactions de l'aggregator l'exigent.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    {{- include "pulse.labels" $l | nindent 4 }}
spec:
  selector:
    {{- include "pulse.selectorLabels" $l | nindent 4 }}
  ports:
    - name: mongo
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    {{- include "pulse.labels" $l | nindent 4 }}
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      {{- include "pulse.selectorLabels" $l | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pulse.labels" $l | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: mongo
          image: {{ .Values.infra.mongo.image }}
          # Sans --wiredTigerCacheSizeGB, MongoDB dimensionne son cache d'après la mémoire de la MACHINE et non
          # celle du pod.
          args: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - name: mongo
              containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          # Au premier passage, la sonde de démarrage initialise le jeu de répliques ; elle ne réussit qu'une fois ce
          # nœud primaire (les écritures sont alors possibles). Les clients se connectent avec directConnection=true.
          startupProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.infra.mongo.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
