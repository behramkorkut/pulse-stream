{{- if .Values.infra.enabled }}
{{- $l := dict "root" $ "name" "redis" }}
# Redis : sessions des visiteurs et dédoublonnage. Deployment suffisant : pas de disque, pas d'identité à garder.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "pulse.labels" $l | nindent 4 }}
spec:
  selector:
    {{- include "pulse.selectorLabels" $l | nindent 4 }}
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "pulse.labels" $l | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pulse.selectorLabels" $l | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pulse.labels" $l | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: {{ .Values.infra.redis.image }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.infra.redis.resources | nindent 12 }}
{{- end }}
