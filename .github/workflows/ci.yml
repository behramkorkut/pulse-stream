# Intégration continue : à chaque push sur main et à chaque pull request, GitHub rejoue les mêmes
# vérifications que `make ci` en local, plus les tests d'intégration contre une vraie infrastructure.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur la même branche annule l'exécution précédente encore en cours : inutile de finir de
# tester un commit déjà dépassé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux : la CI ne fait que lire le dépôt.
permissions:
  contents: read

jobs:
  checks:
    name: Qualité et tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # La version de Go vient de go.mod : une seule source de vérité, aucune dérive entre le Mac et la CI.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go.mod et go.sum sont à jour
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Formatage (gofmt)
        run: make fmt-check

      - name: Analyse statique (go vet)
        run: make vet

      - name: Tests avec détecteur de data races
        run: make cover

      - name: Résumé de la couverture
        run: |
          {
            echo '### Couverture des tests'
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compilation des binaires
        run: make build

  integration:
    name: Tests d'intégration (Redpanda, Redis, MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # On réutilise le docker-compose.yml du projet : la CI teste contre la même infrastructure qu'en local.
      # --wait attend que les healthchecks passent ; seuls les trois services nécessaires sont démarrés.
      - name: Démarrer l'infrastructure
        run: docker compose up -d --wait redpanda redis mongo

      - name: Tests d'intégration
        run: make test-integration

      - name: Journaux de l'infrastructure (en cas d'échec)
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Arrêter l'infrastructure
        if: always()
        run: docker compose down -v

  vulncheck:
    name: Vulnérabilités connues (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Compilé avec la version de Go du projet : toujours compatible, contrairement à un binaire téléchargé.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    name: Image Docker (${{ matrix.program }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        program: [collector, processor, aggregator, loadgen]
    steps:
      - uses: actions/checkout@v7

      - name: Construire l'image
        run: >
          docker build
          --build-arg CMD=${{ matrix.program }}
          --build-arg VERSION=${{ github.sha }}
          -t pulse-stream/${{ matrix.program }}:ci .

      # Une image de production ne doit pas tourner en root : on le vérifie à chaque construction.
      - name: Vérifier l'utilisateur (non-root) et la taille
        run: |
          user="$(docker inspect -f '{{.Config.User}}' pulse-stream/${{ matrix.program }}:ci)"
          echo "utilisateur : ${user}"
          case "${user}" in ''|0|root|0:*|root:*) echo "l'image tourne en root" >&2; exit 1 ;; esac
          docker images pulse-stream/${{ matrix.program }}:ci --format 'taille : {{.Size}}'

      # Le collector sait fonctionner sans Kafka (PUBLISHER=log) : on démarre vraiment le conteneur
      # et on lui envoie une requête, ce qui prouve que le binaire statique s'exécute dans l'image finale.
      - name: Test de fumée du collector
        if: matrix.program == 'collector'
        run: |
          docker run -d --name collector -p 8080:8080 -e PUBLISHER=log pulse-stream/collector:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/collect \
            -d '{"id":"ci-1","type":"pageview","site_id":"s1","visitor_id":"v1","url":"https://example.com/","timestamp":"2026-01-01T00:00:00Z"}')"
          echo "POST /collect -> ${code}"
          test "${code}" = "202"

      - name: Journaux du conteneur (en cas d'échec)
        if: failure() && matrix.program == 'collector'
        run: docker logs collector

  helm:
    name: Chart Helm (lint et rendu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # helm est déjà installé sur les machines GitHub. --strict transforme les avertissements en erreurs.
      - name: helm lint
        run: helm lint --strict deploy/helm/pulse-stream --set-file monitoring.dashboards.pulse-stream=deploy/grafana/dashboards/pulse-stream.json

      # Le chart contient des branches conditionnelles (infra, supervision, service, nombre de répliques) :
      # une valeur par défaut qui marche ne prouve pas que les autres combinaisons produisent du YAML valide.
      - name: Rendu avec les valeurs par défaut
        run: make helm-template > /dev/null

      - name: Rendu sans infrastructure, sans supervision, sans topics
        run: make helm-template HELM_ARGS="--set infra.enabled=false --set monitoring.enabled=false --set topics.create=false" > /dev/null

      - name: Rendu avec 3 processors et sans Service pour le collector
        run: make helm-template HELM_ARGS="--set apps.processor.replicas=3 --set apps.collector.service.enabled=false" > /dev/null

  kubernetes:
    name: Déploiement sur Kubernetes (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Le même cluster que sur le Mac (même fichier de configuration, même nom) : kind y publie les ports 18080,
      # 19090 et 13000 de la machine, que les cibles `make k8s-*` utilisent.
      - name: Créer le cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: pulse
          config: deploy/kind/kind-config.yaml

      - name: Construire et charger les images dans le cluster
        run: |
          make docker-build IMAGES="collector processor aggregator"
          make kind-load

      # Deux processors : on teste aussi la répartition des partitions entre répliques d'un même groupe.
      - name: Installer le chart (attend que tout soit prêt)
        run: make helm-install HELM_ARGS="--set apps.processor.replicas=2"

      - name: Test de fumée du collector
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:18080/healthz)"
          echo "GET /healthz -> ${code}"
          test "${code}" = "200"

      # Prometheus doit avoir découvert tout seul : 1 collector + 2 processors + 1 aggregator.
      - name: Prometheus découvre les 4 pods
        run: |
          for i in $(seq 1 30); do
            up="$(curl -fsS http://localhost:19090/api/v1/targets | jq '[.data.activeTargets[] | select(.health == "up")] | length')"
            echo "cibles up : ${up}"
            test "${up}" = "4" && exit 0
            sleep 2
          done
          exit 1

      # Le test qui compte : de la charge, puis comparaison exacte avec ce que MongoDB a compté.
      # loadgen échoue (code 1) s'il manque ou s'il y a un événement en trop.
      - name: Charge et vérification exacte des compteurs
        run: make k8s-load-verify RATES=500 DURATION=15s WORKERS=64

      - name: État du cluster (en cas d'échec)
        if: failure()
        run: |
          kubectl get pods --namespace pulse -o wide
          kubectl describe pods --namespace pulse
          kubectl logs --namespace pulse --selector app.kubernetes.io/part-of=pulse-stream --all-containers --prefix --tail=100
