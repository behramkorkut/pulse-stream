# Dependabot ouvre une pull request quand une dépendance ou une action GitHub a une nouvelle version :
# la CI la teste, et on fusionne en connaissance de cause.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
